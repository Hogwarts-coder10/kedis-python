[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kedis-python"
version = "0.3.2"
description = "A Redis-inspired in-memory store in Python."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "V SS Karthik" }
]

keywords = ["redis", "in-memory", "key-value", "database", "streams", "pub-sub"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
]
dependencies = ["rich", "pyfiglet"]

[project.urls]
Homepage = "https://github.com/Hogwarts-coder10/kedis-python"

[project.scripts]
kedis-cli = "kedis_python.main:main"
kedis-server = "kedis_python.server:run"

[tool.setuptools.packages.find]
include = ["kedis_python*"]
